{{define "content"}}
<div id="msg" class="msg"></div>
<h1>Active Sessions</h1>
<p class="muted">Manage your active admin sessions. Sessions expire after 12 hours (or 30 days with "Remember me").</p>

<div class="card">
  <div class="row" style="align-items:center; margin-bottom:16px">
    <h3 style="margin:0; flex:1">Your Sessions</h3>
    <button id="btnRevokeAll" class="danger" style="flex:0 0 auto">Logout Everywhere Else</button>
  </div>
  <table>
    <thead><tr><th>Token</th><th>Expires</th><th>Current</th><th></th></tr></thead>
    <tbody id="sessionRows"><tr><td class="muted" colspan="4">loading…</td></tr></tbody>
  </table>
</div>

<script>
async function load() {
  try {
    const d = await api('/api/sessions');
    const rows = document.getElementById('sessionRows');
    if (!d.sessions.length) {
      rows.innerHTML = '<tr><td class="muted" colspan="4">No active sessions.</td></tr>';
      return;
    }
    rows.innerHTML = d.sessions.map(s => '<tr>' +
      '<td class="mono" style="max-width:300px">' + esc(s.token) + '</td>' +
      '<td class="muted">' + esc(new Date(s.expires_at).toLocaleString()) + '</td>' +
      '<td>' + (s.is_current ? '<span class="pill ok">this session</span>' : '<span class="pill mut">other</span>') + '</td>' +
      '<td>' + (s.is_current ? '' : '<button class="sm danger" onclick="revoke(\'' + esc(s.token) + '\')">Revoke</button>') + '</td>' +
      '</tr>').join('');
  } catch (err) {
    flash(err.message, false);
  }
}

async function revoke(token) {
  if (!confirm('Revoke this session?')) return;
  try {
    await api('/api/sessions/revoke', { method: 'POST', body: { token } });
    flash('Session revoked', true);
    load();
  } catch (err) {
    flash(err.message, false);
  }
}

document.getElementById('btnRevokeAll').addEventListener('click', async () => {
  if (!confirm('Revoke ALL other sessions? You will stay logged in on this browser.')) return;
  try {
    await api('/api/sessions/revoke-all', { method: 'POST', body: {} });
    flash('All other sessions revoked', true);
    load();
  } catch (err) {
    flash(err.message, false);
  }
});

load();
</script>
{{end}}
